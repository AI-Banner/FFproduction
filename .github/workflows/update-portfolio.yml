name: Update portfolio from YouTube channel uploads

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: youtube-portfolio-sync
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Update portfolio data from channel uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_SOURCE_VIDEO_ID: YsVx1RGFMu0
          PORTFOLIO_OUTPUT_PATH: assets/portfolio/portfolio-links.json
          PORTFOLIO_STATUS_PATH: assets/portfolio/portfolio-status.json
          MAX_PLAYLIST_ITEMS: '150'
          MAX_API_CALLS: '10'
        run: |
          python scripts/update_portfolio_from_youtube.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio/portfolio-links.json assets/portfolio/portfolio-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update portfolio links from YouTube playlist"
          git push

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_ALERT_WEBHOOK" ]; then
            echo "DISCORD_ALERT_WEBHOOK is not set"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 --retry 2 \
            -H "Content-Type: application/json" \
            -d '{"content":"⚠️ FF Production 포트폴리오 자동 동기화가 실패했습니다. GitHub Actions 로그를 확인해주세요."}' \
            "$DISCORD_ALERT_WEBHOOK"
